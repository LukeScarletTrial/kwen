[package]
name = "kwen"
version = "0.1.0"
edition = "2021"
description = "A fast, robust CLI agent harness tailored for small Qwen models with LM Studio and MCP support"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
rustyline = "14.0"
glob = "0.3"
walkdir = "2.5"
regex = "1.10"
dirs = "5.0"
anyhow = "1.0"
futures = "0.3"
tokio-util = { version = "0.7", features = ["codec"] }
async-trait = "0.1"
chrono = "0.4"
crossterm = "0.29.0"
termimad = "0.35.5"

[package.metadata.npm]
name = "kwen"
targets = ["x86_64-pc-windows-gnu"]